name: Temporary Kinora Desktop Test APK build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-desktop-test-apk:
    name: Build installable desktop-layout test APK
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Check out Kinora Effect
        uses: actions/checkout@v4
      - name: Install Rust 1.95 and Android arm64 target
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.95.0
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
          rustup target add aarch64-linux-android
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustc --version
          rustup target list --installed
      - name: Install Pillow for Android adaptive icons
        run: sudo apt-get update && sudo apt-get install -y python3-pil
      - name: Build side-by-side desktop test APK
        env:
          CARGO_TERM_COLOR: always
          RUST_BACKTRACE: 1
        run: |
          set -euo pipefail
          bash android-builder/build.sh -effectcraft -appname="Kinora Effect Desktop Test" -packagename=com.kinora.effect.desktoptest -appicon=../assets/kinora-icon.png
          mv android-builder/output/kinora-effect-0.16.0.apk android-builder/output/kinora-effect-desktop-test-0.16.0.apk
      - name: Validate and checksum APK
        shell: bash
        run: |
          set -euo pipefail
          APK=android-builder/output/kinora-effect-desktop-test-0.16.0.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libeffectcraft_android.so'
          ls -lh "$APK"
          sha256sum "$APK"
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: kinora-effect-desktop-test-apk
          path: android-builder/output/kinora-effect-desktop-test-0.16.0.apk
          if-no-files-found: error
          retention-days: 1
