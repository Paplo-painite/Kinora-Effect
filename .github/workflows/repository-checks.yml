name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  documentation-and-assets:
    name: Documentation and assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate required project files
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s docs/USER_GUIDE.md
          test -s CONTRIBUTING.md
          test -s SECURITY.md
          test -s assets/kinora-icon.png
          test -s assets/kinora-effect-repository-icon.png
          test -s assets/screenshots/kinora-effect-preview.png

      - name: Validate documentation links and language
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'docs/USER_GUIDE.md' README.md
          grep -Fq 'assets/kinora-effect-repository-icon.png' README.md
          grep -Fq 'assets/screenshots/kinora-effect-preview.png' README.md
          if grep -RInP '[\x{0600}-\x{06FF}]' README.md docs CONTRIBUTING.md SECURITY.md .github; then
            echo 'Arabic text detected in public project documentation.' >&2
            exit 1
          fi

      - name: Verify PNG assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import struct

          assets = [
              Path('assets/kinora-icon.png'),
              Path('assets/kinora-effect-repository-icon.png'),
              Path('assets/screenshots/kinora-effect-preview.png'),
          ]
          for path in assets:
              data = path.read_bytes()
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'{path} is not a PNG file')
              width, height = struct.unpack('>II', data[16:24])
              if width == 0 or height == 0:
                  raise SystemExit(f'{path} has invalid dimensions')
              print(f'{path}: {width}x{height}')
          PY
